name: Build and Publish Plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep user lesson media out of published source
        shell: pwsh
        run: |
          $media = git ls-files | Where-Object {
            $_ -match '(?i)(\.(mp3|wav|pdf|mid|midi)$|\.(notes|course|reference|tablature|playhead|tab-guide)\.json$)' -and
            $_ -cne 'FFTrueBard/Lessons/Indexes/guitar-aerobics.tablature.json' -and
            $_ -cnotmatch '^FFTrueBard/Lessons/Indexes/guitar-aerobics-[0-9]{3}\.playhead\.json$'
          }
          if ($media) { throw 'User lesson media, course catalogs, reference annotations, and note transcriptions must not be committed or published.' }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        run: |
          Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
          Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

      - name: Test pitch, training tools, and diagnostics
        run: dotnet run --project tests/FFTrueBard.Tests.csproj -c Release

      - name: Build (timestamped version)
        shell: pwsh
        run: |
          $ver = (Get-Date).ToUniversalTime().ToString('yyyy.MM.dd.HHmm')
          "VER=$ver" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          dotnet build FFTrueBard/FFTrueBard.csproj -c Release -o artifacts/plugin "-p:Version=$ver"

      - name: Test the bundled PDF renderer
        run: dotnet run --project tests/PdfRenderer/PdfRenderer.Tests.csproj -c Release -- artifacts/plugin

      - name: Package release zip
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
        run: |
            $outDir = Join-Path $pwd 'artifacts/plugin'
            if (-not (Test-Path "$outDir/FFTrueBard.dll")) { throw 'Plugin build output missing.' }

            # The NuGet package supplies the DLL but omits the upstream license files.
            # Fetch notices for the same pinned binary; fail if the archive or DLL differs.
            $upstream = New-Item -ItemType Directory -Path artifacts/pdfium-release -Force
            $archive = Join-Path $upstream.FullName 'pdfium-win-x64.tgz'
            Invoke-WebRequest -Uri https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F8179/pdfium-win-x64.tgz -OutFile $archive
            if ((Get-FileHash $archive).Hash -ne '836A77C9053F624839C66010CDDEA7B675628A36B8831D2330178BB169D241B6') {
              throw 'Unexpected PDFium release archive.'
            }
            tar -xf $archive -C $upstream.FullName LICENSE licenses bin/pdfium.dll
            if ($LASTEXITCODE -ne 0) { throw 'Could not extract PDFium notices.' }
            if ((Get-FileHash "$outDir/fftruebard-pdfium.dll").Hash -ne (Get-FileHash "$($upstream.FullName)/bin/pdfium.dll").Hash) {
              throw 'Bundled PDFium and its license archive do not match.'
            }
            $notices = New-Item -ItemType Directory -Path "$outDir/pdfium-licenses" -Force
            Copy-Item "$($upstream.FullName)/LICENSE" $notices.FullName
            Copy-Item "$($upstream.FullName)/licenses/*" $notices.FullName

            # SoundTouch.Net ships as a separate LGPL library with its license and matching source.
            if (-not (Test-Path "$outDir/SoundTouch.Net.dll") -or -not (Test-Path "$outDir/SoundTouch.Net-LICENSE.txt")) {
              throw 'SoundTouch.Net or its license is missing.'
            }
            $tempoNotices = New-Item -ItemType Directory -Path "$outDir/soundtouch" -Force
            Copy-Item "$outDir/SoundTouch.Net-LICENSE.txt" (Join-Path $tempoNotices.FullName 'LICENSE.txt')
            $tempoSource = Join-Path $tempoNotices.FullName 'SoundTouch.Net-2.3.2-source.zip'
            Invoke-WebRequest -Uri https://codeload.github.com/owoudenberg/soundtouch.net/zip/98e5b8fd2f8efed0ddf7c8f66b435bfb231659dc -OutFile $tempoSource
            if ((Get-FileHash $tempoSource).Hash -ne '6DB11C905DFADDAF2990EFB3FCC5C29DED2A62AEE3C3849AF62C600BADA69C62') {
              throw 'Unexpected SoundTouch.Net source archive.'
            }

            $manifest = [ordered]@{
              Author              = 'claderino'
              Name                = 'FFTrueBard'
              Punchline           = 'Play Final Fantasy XIV with an electric guitar.'
              Description         = 'Guitar practice with local PDF tablature, guided lesson cards, MP3 cues and loops, and optional pitch-order drills. Bring your own lesson files. Game input injection is not implemented.'
              InternalName        = 'FFTrueBard'
              AssemblyVersion     = $env:VER
              RepoUrl             = "https://github.com/$env:REPO"
              ApplicableVersion   = 'any'
              DalamudApiLevel     = 15
              LoadPriority        = 0
              Tags                = @('input', 'guitar', 'music', 'fun')
            }
            ConvertTo-Json $manifest -Depth 6 |
              Set-Content -Encoding utf8 (Join-Path $outDir 'FFTrueBard.json')

            $files = Get-ChildItem $outDir -File | Where-Object { $_.Extension -in '.dll', '.json' }
            Compress-Archive -Path ($files.FullName + @($notices.FullName, $tempoNotices.FullName)) -DestinationPath .\FFTrueBard.zip -Force
            Write-Host "Packaged manually from $outDir"

      - name: Generate pluginmaster.json
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
        run: |
          $zipUrl = "https://github.com/$env:REPO/releases/latest/download/FFTrueBard.zip"
          $m = [ordered]@{
            Author                  = 'claderino'
            Name                    = 'FFTrueBard'
            Punchline               = 'Play Final Fantasy XIV with an electric guitar.'
            Description             = 'Guitar practice with local PDF tablature, guided lesson cards, MP3 cues and loops, and optional pitch-order drills. Bring your own lesson files. Game input injection is not implemented.'
            InternalName            = 'FFTrueBard'
            AssemblyVersion         = $env:VER
            TestingAssemblyVersion  = $env:VER
            RepoUrl                 = "https://github.com/$env:REPO"
            ApplicableVersion       = 'any'
            DalamudApiLevel         = 15
            LoadPriority            = 0
            Tags                    = @('input', 'guitar', 'music', 'fun')
            Changelog               = "Automated build $env:VER"
            DownloadUrlInstall      = $zipUrl
            DownloadUrlUpdate       = $zipUrl
            DownloadUrlTesting      = $zipUrl
            DownloadLinkInstall     = $zipUrl
            DownloadLinkUpdate      = $zipUrl
            DownloadLinkTesting     = $zipUrl
          }
          ConvertTo-Json @($m) -Depth 6 | Set-Content -Encoding utf8 pluginmaster.json

      - name: Publish to the moving 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest
          body: "Automated build ${{ env.VER }} - this release is overwritten on every push to main."
          files: |
            FFTrueBard.zip
            pluginmaster.json
